[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-dice-sim"
version = "0.1.0"
description = "Headless physical foundation for SO-101 dice manipulation"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.3.7",
    "numpy==2.2.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
visualization = ["matplotlib==3.10.7", "pillow==12.0.0"]

[project.scripts]
so101-dice-sim = "so101_dice_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
